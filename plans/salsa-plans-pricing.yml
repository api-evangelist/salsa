description: >-
  Salsa does not publish public self-serve API pricing. It is partner-gated
  embedded payroll infrastructure sold to SaaS platforms under a sales-quoted
  contract, typically priced per-employee-per-month (PEPM) for active paid
  workers, often with a platform base fee and volume tiers. Sandbox access and
  API keys are granted to approved partners; production access requires a
  signed partner agreement. All figures below are structural placeholders -
  actual rates are quoted by Salsa sales and are not published.
notes: >-
