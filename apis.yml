aid: salsa
url: https://raw.githubusercontent.com/api-evangelist/salsa/refs/heads/main/apis.yml
name: Salsa
kind: company
description: Salsa is embedded payroll infrastructure that lets SaaS platforms add
  native, multi-country (US and Canada) payroll to their products through REST and
  GraphQL APIs, embeddable UI components (Salsa Express), and real-time webhooks.
  Partner platforms provision employers and workers, run payroll, disburse worker
  payments, and handle tax setup and filings without leaving their own app. API
  access is partner-gated - Salsa issues sandbox and production Bearer API keys to
  approved platform partners.
