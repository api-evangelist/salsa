publisherName: Salsa
serviceCategory: Payroll and Embedded Finance
billingModel:
  pricingCategory: Subscription-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: Salsa Embedded Payroll
  ServiceCategory: Payroll and Embedded Finance
  ProviderName: Salsa
  PublisherName: Salsa
  InvoiceIssuerName: Salsa
  BillingCurrency: USD
  ChargeCategory: Usage
  PricingCategory: Subscription-Based
meters:
- name: active_paid_workers
  description: Count of active paid workers per employer per pay cycle - primary PEPM cost driver.
  unit: workers
  aggregation: sum
  dimensions:
  - partner
  - employer
  - country
- name: platform_base_fee
  description: Flat monthly platform fee charged to the partner independent of worker count.
  unit: contract
  aggregation: max
  dimensions:
  - partner
- name: employer_count
  description: Number of employers provisioned by the partner platform.
  unit: employers
  aggregation: sum
  dimensions:
  - partner
- name: payroll_disbursement_dollars
  description: Pass-through payroll funds moved (employer funding and worker disbursement); not a Salsa platform fee.
  unit: USD
  aggregation: sum
  dimensions:
  - partner
  - employer
principles:
- name: Visibility
  description: Track active paid workers per employer per cycle; reconcile PEPM against the Salsa partner invoice.
- name: Allocation
  description: Map worker counts to end-customer employers so payroll platform cost can be attributed or resold per company.
- name: Optimization
  description: Right-size the paid-worker base, prune inactive employers, and confirm the billing metric (active vs. paid) to avoid overcounting.
- name: Accountability
  description: Assign an owner for the Salsa partner relationship; review PEPM spend and payroll volume monthly against budget.
