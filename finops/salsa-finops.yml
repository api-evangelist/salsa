description: >-
  FinOps view of Salsa embedded payroll spend for a platform partner. Salsa
  bills partners under a sales-quoted contract, typically per-active-paid-worker
  per month (PEPM) plus a platform base fee, rather than per-API-call. The unit
  cost driver is the count of active paid workers across the partner's employers
  each pay cycle, so cost scales with the partner's payroll volume, not with API
  request throughput. Money-movement (employer funding and worker disbursement)
  is a pass-through of the actual payroll dollars and is separate from Salsa
  platform fees.
notes: >-
  Public rates are not published; PEPM and base fees are sales-quoted. Verify the
  exact billing metric (active vs. paid workers), base fee, and any off-cycle or
  transaction fees against the partner agreement during reconciliation.
