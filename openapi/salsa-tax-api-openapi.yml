openapi: 3.2.0
info:
  title: Salsa Payroll Tax API
  description: Representative OpenAPI description of the Salsa embedded payroll REST API.
  termsOfService: https://www.salsa.dev/legal
  contact:
    name: Salsa Support
    url: https://docs.salsa.dev/
  version: rest-v1
servers:
- url: https://api.salsa.dev/api/rest/v1
  description: Production (partner production API key)
- url: https://api.sandbox.salsa.dev/api/rest/v1
  description: Sandbox (partner sandbox API key)
security:
- bearerAuth: []
tags:
- name: Tax
  description: Employer and worker tax setup.
paths:
  /employers/{employerId}/taxes-setup:
    parameters:
    - $ref: '#/components/parameters/EmployerId'
    get:
      operationId: getEmployerTaxSetup
      tags:
      - Tax
      summary: Retrieve an employer's tax setup and withholding configuration
      responses:
        '200':
          description: Employer tax setup.
components:
  parameters:
    EmployerId:
      name: employerId
      in: path
      required: true
      description: The employer (company) identifier.
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Partner Bearer API key. Approved Salsa platform partners receive separate sandbox and production keys. Send as `Authorization: Bearer ${YOUR_API_TOKEN}`.'
